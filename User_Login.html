<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <link rel="icon" href="Agriseva_icon.png" type="image/png">

  <!-- Bulma CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">

  <!-- Bootstrap CSS -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    body {
      background-color: aquamarine;
    }

    form {
      background: hwb(0 98% 2%);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
      max-width: 400px;
      margin: 50px auto;
      text-align: center;
    }

    .input {
      width: 100%;
    }

    #toastContainer {
      position: fixed;
      top: 25px;
      margin-left: 450px;
      z-index: 9999;
    }

    .is-clickable {
      cursor: pointer;
    }
  </style>
</head>
<body>

<!-- LOGIN FORM -->
<div id="loginForm" class="section">
  <div class="container">
    <div class="box" style="max-width: 400px; margin: auto;">
      <form id="loginform" onsubmit="handleLogin(event)">
        <h2 class="title is-4 has-text-centered">Login</h2>

        <div class="field">
          <label class="label" for="user">Username</label>
          <div class="control">
            <input class="input" type="text" name="username" id="user" required>
          </div>
        </div>

        <div class="field">
          <label class="label" for="pwd">Password</label>
          <div class="control has-icons-right">
            <input class="input" type="password" name="password" id="pwd" required>
            <span class="icon is-small is-right is-clickable" id="toggleEye">
              <i class="fas fa-eye" id="eyeIcon"></i>
            </span>
          </div>
        </div>

        <div class="field has-text-centered">
          <button class="button is-success is-fullwidth" type="submit">Login</button>
        </div>

        <p class="has-text-centered">
          <a href="javascript:void(0);" onclick="showFg_Psw()">Forgot Password</a>
        </p>
        <p class="has-text-centered">
          <a href="javascript:void(0);" onclick="showSignUpForm()">New User</a>
        </p>
      </form>
    </div>
  </div>
</div>

<!-- SIGNUP FORM -->
<div id="signupForm" class="section" style="display: none;">
  <form id="signupFormData">
    <h2 class="title is-4 has-text-centered">Sign Up</h2>

    <div class="field">
      <label class="label">Full Name</label>
      <input class="input" type="text" name="full_name" required>
    </div>

    <div class="field">
      <label class="label">Mobile No</label>
      <input class="input" type="tel" name="mobile_no" maxlength="10" required>
    </div>

    <div class="field">
      <label class="label">Username</label>
      <input class="input" type="text" name="username" required>
    </div>

    <div class="field">
        <label class="label" for="pwd">Password</label>
        <div class="control has-icons-right">
          <input class="input" type="password" name="password" id="pwd" required>
          <span class="icon is-small is-right is-clickable" id="toggleEye">
            <i class="fas fa-eye" id="eyeIcon"></i>
          </span>
        </div>
    </div>
    <div class="field">
        <label class="label">Email</label>
        <input class="input" type="email" name="email" required>
      </div>

    <div class="field has-text-centered">
      <button class="button is-success is-fullwidth" type="submit">Sign Up</button>
    </div>

    <p class="has-text-centered"><a href="javascript:void(0);" onclick="showLoginForm()">Back to Login</a></p>
  </form>
</div>

<!-- FORGOT PASSWORD FORM -->
<div id="fg_psd" class="section" style="display: none;">
  <form>
    <h3 class="title is-4 has-text-centered">Forgot Password</h3>

    <div class="field">
      <label class="label">Username</label>
      <input class="input" type="text">
    </div>

    <div class="field">
      <label class="label">Email</label>
      <input class="input" type="email">
    </div>

    <div class="field has-text-centered">
      <button class="button is-warning is-fullwidth">Reset Password</button>
    </div>

    <p class="has-text-centered"><a href="javascript:void(0);" onclick="showLoginForm()">Back to Login</a></p>
  </form>
</div>

<!-- TOAST CONTAINER -->
<div id="toastContainer"></div>

<!-- SCRIPT -->
<script>
  // Toggle password visibility
  function togglePassword() {
    const pwd = document.getElementById('pwd');
    const icon = document.getElementById('eyeIcon');
    if (pwd.type === "password") {
      pwd.type = "text";
      icon.classList.remove("fa-eye");
      icon.classList.add("fa-eye-slash");
    } else {
      pwd.type = "password";
      icon.classList.remove("fa-eye-slash");
      icon.classList.add("fa-eye");
    }
  }

  document.getElementById('toggleEye').addEventListener('click', togglePassword);

  function showSignUpForm() {
    document.getElementById('loginForm').style.display = "none";
    document.getElementById('signupForm').style.display = "block";
    document.getElementById('fg_psd').style.display = "none";
  }

  function showLoginForm() {
    document.getElementById('signupForm').style.display = "none";
    document.getElementById('fg_psd').style.display = "none";
    document.getElementById('loginForm').style.display = "block";
  }

  function showFg_Psw() {
    document.getElementById('loginForm').style.display = "none";
    document.getElementById('signupForm').style.display = "none";
    document.getElementById('fg_psd').style.display = "block";
  }

  function showToast(message, type = 'success') {
    const toastId = 'toast_' + Date.now();
    const bgClass = type === 'success' ? 'bg-success' : 'bg-danger';

    const toast = document.createElement('div');
    toast.className = `toast align-items-center text-white ${bgClass} border-0 show`;
    toast.id = toastId;
    toast.setAttribute('role', 'alert');
    toast.setAttribute('aria-live', 'assertive');
    toast.setAttribute('aria-atomic', 'true');
    toast.style.minWidth = '250px';
    toast.style.marginBottom = '10px';

    toast.innerHTML = `
      <div class="d-flex">
        <div class="toast-body">${message}</div>
        <button type="button" class="ml-2 mb-1 close btn-close btn-close-white" onclick="document.getElementById('${toastId}').remove();"></button>
      </div>
    `;

    document.getElementById('toastContainer').appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  function handleLogin(event) {
    event.preventDefault();
    const form = document.getElementById("loginform");
    const formData = new FormData(form);

    fetch("user_login_php_conn.php", {
      method: "POST",
      body: formData
    })
    .then(response => response.json())
    .then(data => {
      showToast(data.message, data.status);
      if (data.status === "success") {
        setTimeout(() => window.location.href = data.redirect, 1500);
      }
    })
    .catch(() => {
      showToast("Something went wrong! Try again.", 'error');
    });
  }

  document.getElementById("signupFormData").addEventListener("submit", function (event) {
    event.preventDefault();

    const form = this;
    const formData = new FormData(form);
    const mobileNo = form.mobile_no.value.trim();

    if (!/^\d{10}$/.test(mobileNo)) {
      showToast("Mobile number must be exactly 10 digits", 'error');
      return;
    }

    fetch("user_signup_php_conn.php", {
      method: "POST",
      body: formData
    })
    .then(response => response.text())
    .then(text => {
      try {
        const data = JSON.parse(text);
        showToast(data.message, data.status);

        if (data.status === "success") {
          setTimeout(showLoginForm, 1500);
        }
      } catch (err) {
        console.error("Response parsing error:", text);
        showToast("Invalid response from server.", 'error');
      }
    })
    .catch(err => {
      console.error("Signup request failed:", err);
      showToast("Signup failed! Please try again.", 'error');
    });
  });
</script>

<!-- Bootstrap JS + jQuery -->
<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
